<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">PRISM method and backbone integration diagram</title>
  <desc id="desc">PRISM learns first- and second-order interactions from deployable proprioception, projects them through an MLP and RMSNorm, and inserts the resulting representation into BFM-Zero or SmolVLA.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#46674a"/>
    </marker>
    <linearGradient id="interactionGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315a3a"/>
      <stop offset="1" stop-color="#d39b35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#203126" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1424" height="634" rx="30" fill="#fbf8f0"/>
  <rect x="8" y="8" width="1424" height="634" rx="30" fill="none" stroke="#d8d0c1" stroke-width="2"/>

  <text x="42" y="55" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="24" font-weight="900" fill="#203b29">
    Learned interactions from deployable robot state
  </text>
  <text x="42" y="84" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="16" fill="#5d665f">
    Degree-2 path shown; the same learned recurrence supports higher polynomial degree.
  </text>
  <rect x="1240" y="36" width="150" height="42" rx="21" fill="#315a3a"/>
  <text x="1315" y="63" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="17" font-weight="900" fill="#fffaf0">
    PRISM
  </text>

  <g filter="url(#shadow)">
    <rect x="36" y="157" width="222" height="340" rx="25" fill="#f2ede2" stroke="#d4cbbb" stroke-width="2"/>
    <text x="147" y="196" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="18" font-weight="900" fill="#203b29">
      Deployable state
    </text>
    <text x="147" y="241" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="43" font-weight="700" fill="#18241c">
      x
    </text>

    <rect x="62" y="269" width="170" height="37" rx="18" fill="#e3ecde"/>
    <text x="147" y="293" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="700" fill="#315a3a">
      joint state + velocity
    </text>
    <rect x="62" y="317" width="170" height="37" rx="18" fill="#e3ecde"/>
    <text x="147" y="341" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="700" fill="#315a3a">
      previous actions
    </text>
    <rect x="62" y="365" width="170" height="37" rx="18" fill="#e3ecde"/>
    <text x="147" y="389" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="700" fill="#315a3a">
      motion commands
    </text>

    <text x="147" y="442" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="13" font-weight="700" fill="#7a5a28">
      no force or tactile input
    </text>
    <text x="147" y="464" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="13" font-weight="700" fill="#7a5a28">
      no privileged physics
    </text>
  </g>

  <path d="M258 327 L307 327" fill="none" stroke="#46674a" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="310" y="112" width="714" height="426" rx="28" fill="#fffdf8" stroke="#cbd5c8" stroke-width="2"/>
    <text x="344" y="153" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="19" font-weight="900" fill="#203b29">
      Factorized polynomial representation
    </text>
    <rect x="838" y="129" width="151" height="30" rx="15" fill="#edf2e8"/>
    <text x="913" y="149" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="12" font-weight="800" fill="#46674a">
      learned end-to-end
    </text>

    <rect x="344" y="184" width="260" height="102" rx="20" fill="#e9f0e4" stroke="#c8d6c4" stroke-width="2"/>
    <text x="474" y="215" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="900" fill="#315a3a">
      FIRST-ORDER PATH
    </text>
    <text x="474" y="255" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700" fill="#18241c">
      L(x) = W<tspan baseline-shift="sub" font-size="16">l</tspan>x + b<tspan baseline-shift="sub" font-size="16">l</tspan>
    </text>

    <rect x="344" y="316" width="260" height="122" rx="20" fill="#fff2d8" stroke="#e5c47e" stroke-width="2"/>
    <text x="474" y="347" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="900" fill="#8a5a18">
      LEARNED CONTEXT
    </text>
    <text x="474" y="383" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700" fill="#18241c">
      C(x) = 1 + &#945; &#8857;
    </text>
    <text x="474" y="412" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" fill="#18241c">
      (W<tspan baseline-shift="sub" font-size="14">r</tspan>x + b<tspan baseline-shift="sub" font-size="14">r</tspan>)
    </text>
    <text x="474" y="429" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="11" font-weight="700" fill="#8a5a18">
      per-feature &#945; starts near zero
    </text>

    <path d="M604 235 C627 235 626 274 646 274" fill="none" stroke="#46674a" stroke-width="3.5" marker-end="url(#arrow)"/>
    <path d="M604 377 C627 377 626 348 646 348" fill="none" stroke="#46674a" stroke-width="3.5" marker-end="url(#arrow)"/>

    <rect x="648" y="215" width="184" height="181" rx="23" fill="url(#interactionGradient)"/>
    <text x="740" y="250" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="900" fill="#fffaf0">
      INTERACTION LIFT
    </text>
    <text x="740" y="292" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="25" font-weight="700" fill="#fffaf0">
      h<tspan baseline-shift="sub" font-size="15">2</tspan>(x)
    </text>
    <text x="740" y="330" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700" fill="#fffaf0">
      L(x) &#8857; C(x)
    </text>
    <text x="740" y="366" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="13" font-weight="800" fill="#fff6dc">
      first + second order
    </text>

    <path d="M832 306 L866 306" fill="none" stroke="#46674a" stroke-width="3.5" marker-end="url(#arrow)"/>

    <rect x="869" y="228" width="128" height="157" rx="22" fill="#eef1ec" stroke="#ccd4ca" stroke-width="2"/>
    <text x="933" y="265" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="15" font-weight="900" fill="#315a3a">
      MLP
    </text>
    <text x="933" y="295" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="18" font-weight="800" fill="#7b847d">
      &#8595;
    </text>
    <text x="933" y="324" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="900" fill="#315a3a">
      RMSNorm
    </text>
    <text x="933" y="365" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" fill="#18241c">
      z
    </text>

    <rect x="344" y="466" width="653" height="45" rx="18" fill="#f3f0e8"/>
    <text x="670" y="494" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="700" fill="#59645d">
      Degree K: repeat learned context factors, h<tspan baseline-shift="sub" font-size="10">k</tspan> = h<tspan baseline-shift="sub" font-size="10">k-1</tspan> &#8857; (1 + &#945;<tspan baseline-shift="sub" font-size="10">k</tspan> &#8857; r<tspan baseline-shift="sub" font-size="10">k</tspan>(x))
    </text>
  </g>

  <path d="M1024 306 L1042 306 L1042 229 L1064 229" fill="none" stroke="#46674a" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M1042 306 L1042 426 L1064 426" fill="none" stroke="#46674a" stroke-width="3.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1066" y="138" width="338" height="176" rx="24" fill="#eaf0e6" stroke="#c8d6c4" stroke-width="2"/>
    <rect x="1092" y="158" width="129" height="27" rx="13" fill="#315a3a"/>
    <text x="1156" y="177" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="11" font-weight="900" fill="#fffaf0">
      RL LOCOMOTION
    </text>
    <text x="1092" y="218" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="22" font-weight="900" fill="#203b29">
      BFM-Zero
    </text>
    <text x="1092" y="246" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" fill="#566159">
      PRISM transforms history_actor only.
    </text>
    <text x="1092" y="283" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="800" fill="#315a3a">
      z &#8594; actor &#8594; joint targets
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1066" y="338" width="338" height="176" rx="24" fill="#fff2d8" stroke="#e5c47e" stroke-width="2"/>
    <rect x="1092" y="358" width="155" height="27" rx="13" fill="#b87823"/>
    <text x="1169" y="377" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="11" font-weight="900" fill="#fffaf0">
      VLA MANIPULATION
    </text>
    <text x="1092" y="418" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="22" font-weight="900" fill="#5f431d">
      SmolVLA
    </text>
    <text x="1092" y="446" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" fill="#6b5c47">
      PRISM replaces state_proj only.
    </text>
    <text x="1092" y="483" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="800" fill="#8a5a18">
      vision + language + z &#8594; action expert
    </text>
  </g>

  <rect x="36" y="570" width="1368" height="48" rx="20" fill="#294c33"/>
  <text x="720" y="600" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="16" font-weight="800" fill="#fffaf0">
    Same policy interfaces and training objectives; PRISM changes only the proprioceptive representation.
  </text>
</svg>
